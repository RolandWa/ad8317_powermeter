# emerge_config.toml — EMerge FEM Simulation Plugin configuration
# This file is the single configuration source for the KiCad action plugin.
# Copy it into ~/.local/share/kicad/9.0/scripting/plugins/emerge_plugin/ after
# installation, or let build.py / sync_to_kicad.ps1 do it automatically.

# ─────────────────────────────────────────────────────────────────────────────
# Debug mode
#   debug = true  → passes --debug to emerge_runner and sets EMERGE_DEBUG=1
#   Also activatable via environment variable: set EMERGE_DEBUG=1
# ─────────────────────────────────────────────────────────────────────────────

debug = true

# ─────────────────────────────────────────────────────────────────────────────
# Port definitions
#   pad    = "REF:pad_number"  — resolved from the open .kicad_pcb file
#   R      = port reference impedance in ohms (default 50)
#   C      = series capacitance in farads (leave unset for purely resistive)
#   active = true  → excitation port (source); false → observation port
#   dir    = excitation direction: "z" (normal to board), "x", or "y"
# ─────────────────────────────────────────────────────────────────────────────

[ports.PORT1]
pad    = "J1:1"    # SMA input connector centre pin
R      = 50.0
active = true
dir    = "z"

[ports.PORT2]
pad    = "U1:1"      # AD8317 INHI — pin 1 (LFCSP-8)
R      = 200.0       # AD8317 input resistance [Ω]
C      = 2e-12       # AD8317 input capacitance [F]  (200Ω ∥ 2 pF equivalent)
active = false       # load port
dir    = "z"

[ports.PORT3]
pad    = "U1:8"      # AD8317 INLO — pin 8 (LFCSP-8)
R      = 200.0       # AD8317 input resistance [Ω]
C      = 2e-12       # AD8317 input capacitance [F]  (200Ω ∥ 2 pF equivalent)
active = false       # load port
dir    = "z"

# ─────────────────────────────────────────────────────────────────────────────
# Frequency sweep
# ─────────────────────────────────────────────────────────────────────────────

[sweep]
start_hz         = 100_000_000    # 100 MHz
stop_hz          = 6_000_000_000  # 6 GHz
steps            = 21             # keep low for test runs; increase to 101+ for production
cells_per_lambda = 10             # mesh density — increase for better accuracy (15+ for production)

# ─────────────────────────────────────────────────────────────────────────────
# Mesh settings
#   curved_boundary_resolution  — arc faceting for curved pads / board outlines.
#     GMSH default is ~10; low values cause "PLC: segment and facet intersect"
#     errors on PCBs with rounded pads.  50–200 is safe for most boards.
#     Set higher (200–500) if GMSH still reports PLC errors after a first run.
#   max_mesh_size_mm  — global upper bound on element edge length in mm.
#     0 = let EMerge/GMSH decide automatically (default).
#   min_mesh_size_mm  — global lower bound on element edge length in mm.
#     0 = no lower bound (default).
# ─────────────────────────────────────────────────────────────────────────────

[mesh]
# curved_boundary_resolution: EMerge/GMSH arc meshing density for curved surfaces.
#   EMerge hint: use 20–50 (too high → GMSH edge-recovery failure; too low → coarse arcs).
curved_boundary_resolution = 40

max_mesh_size_mm            = 0     # 0 = auto (CharacteristicLengthMax used instead)
min_mesh_size_mm            = 0     # 0 = auto

# gerber_circ_segments: line segments per circle arc in layer_from_file() Gerber parsing.
#   EMerge default is 8 — too coarse; polygon vertices land on flat board-outline faces
#   in GMSH, causing PLC / edge-recovery errors.
#   64 creates smooth circular pads without degenerate tiny edges.
gerber_circ_segments        = 64

# gerber_res_mm: geometry resolution passed to layer_from_file() as res_mm.
#   Smaller = more detailed copper trace geometry; larger = faster, less detail.
#   Default EMerge value 0.01 (10 µm) is very fine and creates many tiny edges that
#   GMSH struggles to mesh. 0.05 mm (50 µm) is a good RF accuracy / stability trade-off.
gerber_res_mm               = 0.05

# ── GMSH mesher algorithm selection ────────────────────────────────────────────
# algorithm_2d: GMSH 2D algorithm (Mesh.Algorithm)
#   1=MeshAdapt  5=Delaunay  6=Frontal-Delaunay(recommended)  8=Frontal-quads
algorithm_2d                = 6

# algorithm_3d: GMSH 3D algorithm (Mesh.Algorithm3D)
#   1=Delaunay(default)  4=Frontal  10=HXT(robust for slivers, use if 1 keeps failing)
algorithm_3d                = 1

# smoothing: Laplacian smoothing passes applied after mesh generation.
smoothing                   = 10

# max_mesh_retries: how many edge-recovery surface fixes to attempt before
#   switching to the HXT fallback and ultimately giving up.
max_mesh_retries            = 8

# ── CharacteristicLengthMax auto-calculation ───────────────────────────────────
# The global mesh size upper bound is derived from the shortest boundary curve found
# on any "large" surface (bbox ≥ 1 mm on both X and Y axes), multiplied by
# char_length_max_factor, then clamped to [floor, ceil].
# Curves shorter than artifact_threshold_um are skipped as boolean-op artefacts.

artifact_threshold_um       = 50    # µm — curves shorter than this skipped in scan
char_length_max_factor      = 0.80  # CharacteristicLengthMax = min_curve_len × factor
char_length_max_floor_mm    = 0.15  # minimum CharacteristicLengthMax (mm)
char_length_max_ceil_mm     = 0.50  # maximum CharacteristicLengthMax (mm)

# ── Sliver surface handling ────────────────────────────────────────────────────
# Boolean CSG operations leave tiny residual "sliver" faces whose bbox diagonal
# is smaller than sliver_threshold_mm.  These are detected and either patched
# (forced coarse transfinite mesh) or compounded with adjacent large surfaces.
sliver_threshold_mm         = 0.10  # mm — surfaces with bbox_diag < this are slivers

# ── Per-region mesh sizes ──────────────────────────────────────────────────────
# Override mesh element size per geometric region.  0 = inherit CharacteristicLengthMax.
# Applied via GMSH mesh.setSize() on boundary vertices after geometry commit.
#
# Rule of thumb for RF signal integrity:
#   copper traces  — at least 3 elements across the narrowest trace (e.g. 0.10 mm for 50-Ω line)
#   components     — fine enough to resolve the lumped-element geometry (0.08–0.12 mm)
#   substrate      — can be slightly coarser than copper (1–2× copper size)
#   air / PML      — can be very coarse; EM fields decay rapidly in the absorbing layer
#
mesh_copper_mm              = 0.20  # F.Cu / B.Cu copper traces and fills
mesh_component_mm           = 0.15  # lumped R/L/C component faces and port surfaces
mesh_substrate_mm           = 0.40  # FR4 dielectric interior
mesh_air_mm                 = 2.50  # PML absorbing boundary / air box

# ─────────────────────────────────────────────────────────────────────────────
# Pass/fail thresholds
#   Violation is flagged when the simulated value EXCEEDS the threshold.
# ─────────────────────────────────────────────────────────────────────────────

[thresholds]
insertion_loss_db = 3.0   # |S21| > 3 dB loss triggers a warning
return_loss_db    = 10.0  # |S11| < 10 dB return loss triggers a warning

# ─────────────────────────────────────────────────────────────────────────────
# Gerber export settings (used by GerberExporter stage)
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Solver engine (linear algebra backend for the FEM system)
#   "auto"    — EMerge picks the best available solver automatically (default)
#   "pardiso" — Intel MKL PARDISO (fast direct; requires MKL)
#   "mumps"   — MUMPS parallel direct solver
#   "cuda"    — NVIDIA cuDSS GPU solver (requires CUDA GPU)
#   "superlu" — SuperLU sparse direct (always available)
#   "umfpack" — UMFPACK (requires SciPy)
# ─────────────────────────────────────────────────────────────────────────────

[solver]
engine = "cuda"

# ─────────────────────────────────────────────────────────────────────────────
# Visualization — show interactive 3D windows before the FEM solve starts.
# Both windows are blocking: close the viewer to continue.
#   show_geometry = true  → open PyVista viewer after model build (ports + BCs visible)
#   show_mesh     = true  → open PyVista viewer after mesh generation (surface mesh)
# ─────────────────────────────────────────────────────────────────────────────

[visualization]
show_geometry = true  # set true only for interactive debugging (blocks pipeline)
show_mesh     = true  # set true only for interactive debugging (blocks pipeline)

# ─────────────────────────────────────────────────────────────────────────────
# Gerber export settings (used by GerberExporter stage)
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Passive component modelling (R, L, C)
#   model_passives = true  → automatically identify all R*/L*/C* footprints,
#                            parse their values, and insert lumped element
#                            geometry into the FEM model before the solve.
#   skip = ["R5", "C3"]    → exclude specific components (e.g. decoupling caps
#                            that are too small to affect the RF path, or
#                            components not yet populated on the board).
#
# Zero-ohm jumpers (0R), DNP, NC, and unparseable values are always skipped.
# ─────────────────────────────────────────────────────────────────────────────

[passives]
model_passives = true  # temporarily disabled to isolate GMSH edge-recovery failure
skip           = []    # e.g. ["C5", "C6", "R10"] to exclude specific parts

[gerber]
# Path to kicad-cli executable — leave empty to auto-detect
kicad_cli = ""

# use_gerbers = true  → emerge.beta.gerber.FileBasedPCB — original high-level API.
#                        Reads the Gerber directory directly (auto-scans layers),
#                        uses pcb.add_port() / pcb.solve() / pcb.export_touchstone().
#                        Most accurate copper geometry. Recommended for production.
# use_gerbers = false → PCBNew — simplified uniform copper planes (fast, seconds).
#                        Low-level Simulation API. Use for quick domain/port checks.
use_gerbers = true

# ─────────────────────────────────────────────────────────────────────────────
# Python interpreter used to run emerge_runner.py (system Python, not KiCad's)
#   Set this to the full path of the Python exe that has emerge installed.
#   Leave empty to auto-detect (searches AppData, PATH, etc.).
# ─────────────────────────────────────────────────────────────────────────────

[python]
python_exe = "C:\\Users\\<user>\\AppData\\Local\\Programs\\Python\\Python312\\python.exe"

[gerber.layers]
# Layers to export — names must match those in the .kicad_pcb stackup
copper  = ["F.Cu", "B.Cu"]
mask    = ["F.Mask", "B.Mask"]
silk    = ["F.Silkscreen", "B.Silkscreen"]
edge    = ["Edge.Cuts"]
